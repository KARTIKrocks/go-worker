name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go-version: ['1.24', '1.25', '1.26']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        shell: bash
        run: go test -v -race -count=1 -coverprofile=coverage.out $(go list ./... | grep -v /examples/)
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26'
        run: go tool cover -func=coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build examples
        run: |
          for dir in examples/*/; do
            go build "./$dir"
          done
      - name: Benchmark
        run: go test -bench=. -benchmem -count=3 $(go list ./... | grep -v /examples/)
