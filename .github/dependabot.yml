version: 2
updates:
  # go-worker has no third-party dependencies today; this keeps it covered the
  # moment one is added.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  # Grouped so Docusaurus's large tree doesn't bury the Go module PRs.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    open-pull-requests-limit: 3
    groups:
      docusaurus:
        update-types: ["minor", "patch"]
        patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"
      website:
        update-types: ["minor", "patch"]
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels:
      - ci
    open-pull-requests-limit: 5
