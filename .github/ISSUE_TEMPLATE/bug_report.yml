name: Bug Report
description: Report a bug in go-worker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal steps (ideally a runnable snippet) to reproduce the issue.
      placeholder: |
        1. Create a pool with worker.New(...) and options ...
        2. Submit a job that ...
        3. Close the pool / wait for the result ...
        4. See error ...
      render: go
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include panics, stack traces or `-race` output if any.
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Output of `go version`.
      placeholder: "go1.27.1 linux/amd64"
    validations:
      required: true

  - type: input
    id: go-worker-version
    attributes:
      label: go-worker Version
      description: The version of go-worker you are using.
      placeholder: "v0.0.1"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, or screenshots.
